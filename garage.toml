# RedDrop — Garage (S3-Buckets, Profil "speicher"). Ein einzelner Server, keine Kopien auf anderen Rechnern:
# fuer Ausfallsicherheit sorgen die eigenen Backups. rpc_secret und admin_token kommen aus der .env
# (GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN, erzeugt vom Update-Dienst beim Einschalten).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
