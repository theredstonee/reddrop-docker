services:
  app:
    image: ghcr.io/theredstonee/reddrop:latest
    restart: unless-stopped
    environment:
      NUXT_DB_URL: ${DB_URL:?Bitte DB_URL in .env setzen}
      RD_NODE_NAME: ${RD_NODE_NAME:-}
      TZ: ${TZ:-Europe/Berlin}
      RD_NODE_ROLE: ${RD_NODE_ROLE:-}
    volumes:
      - dateien:/data
    ports:
      - "${RD_BIND:-127.0.0.1}:${RD_PORT:-3000}:3000"
    stop_grace_period: 20s

volumes:
  dateien:
