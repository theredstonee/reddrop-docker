# RedDrop — ohne eigenen Caddy: die App hoert auf EINEM Port, dein vorhandener Webserver
# (nginx, Apache, Plesk …) leitet die Domain dorthin weiter und macht HTTPS.
# Aktiv, wenn in .env steht:  COMPOSE_FILE=docker-compose.yml:compose.port.yml
#
#   RD_PORT=8080            der Port (install.sh sucht einen freien)
#   RD_BIND=127.0.0.1       nur von diesem Server aus erreichbar (Standard); 0.0.0.0 = von ueberall
#   RD_PROXY_DOMAIN=…       Domain, unter der dein Webserver RedDrop ausliefert (optional)
#
# Dein Webserver muss die Header Host, X-Forwarded-Proto und X-Forwarded-For setzen — die
# Vorlage dafuer zeigt install.sh und RedDrop unter Einstellungen → Verbindung.
services:
  app:
    ports:
      - "${RD_BIND:-127.0.0.1}:${RD_PORT:?Bitte RD_PORT in .env setzen}:3000"
    environment:
      RD_PORT: ${RD_PORT}
      RD_BIND: ${RD_BIND:-127.0.0.1}
      RD_PROXY_DOMAIN: ${RD_PROXY_DOMAIN:-}
